# Gameplay values are code-owned bases multiplied by these positive values.
player_speed_multiplier = 5.0
enemy_speed_multiplier = 5.0
bomb_fuse_duration_multiplier = 0.5
explosion_duration_multiplier = 0.5
damage_invulnerability_multiplier = 1.0

# Odd dimensions from 11 through 31 are supported.
arena_width_cells = 21
arena_height_cells = 21
random_seed_on_reset = true

# Enables adaptive framing and Player tracking.
camera_auto_frame = true

# Percentage of the arena kept in the camera framing.
# 100 shows the complete arena. Lower values move the camera closer and
# require following the Player. Valid range: 60 through 100.
camera_map_coverage_percent = 100

# Base 1000: scales survival scoring; higher favours defensive choices, lower
# reduces their relative score. Imminent danger always forces escape regardless.
ai_survival_utility_multiplier = 1.0
# Base 35: higher reacts more to inferred pursuit/traps, lower tolerates more
# observed proximity. Never reveals an opponent's intentions or attributes.
ai_threat_response_multiplier = 1.0
# Attack base 90, approach 30: higher favours competition, lower avoids it.
# Does not bypass line of sight, safe flight, or the one-bomb committed cycle.
ai_aggression_utility_multiplier = 1.0
# Pickup base 65, heart 85 per missing life: higher favours visible useful items,
# lower favours other actions. Does not reveal hidden items or change effects.
ai_pickup_utility_multiplier = 1.0
# Base 45: higher favours opening blocked routes, lower leaves walls longer.
# Safe escape and actual wall destruction remain mandatory.
ai_wall_destruction_utility_multiplier = 1.0
# Base 15: higher favours exploration, lower favours other valid objectives.
# Cannot enter occupied cells or forecast danger.
ai_exploration_utility_multiplier = 1.0
# Base observation window 0.8 seconds, divided by caution (minimum divisor 0.25).
# Higher assumes less time to flee; lower allows a longer estimated window.
# This is uncertainty, never the opponent fuse; observed corridors stay risky.
ai_unknown_bomb_caution_multiplier = 100.0
# Base penalty 20: higher penalizes destinations with few exits under threat,
# lower accepts tighter safe routes. Never makes unsafe bomb placement valid.
ai_trap_avoidance_multiplier = 1.0

# Enemy profile IDs select code-owned Utility factors; they do not alter hard
# survival, perception, RNG, safe flight, or any other enemy's memory.
# 1 = Aggressive, Red
# 2 = Coward, Orange
# 3 = Strategist, Blue
# 4 = Hunter, Green
# 5 = Scavenger, Cyan
# Omitted slots use the documented default ID 3 (Strategist).
enemy_0_profile = 2
enemy_1_profile = 2
enemy_2_profile = 2
