<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="Bootstrap prepares Game and Engine; Game uses Engine; Engine uses SDL3, OpenGL, and stb"><rect width="1000" height="350" rx="20" fill="#101923"/><style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f0f5fa;font-size:22px;font-weight:700}.label{fill:#f0f5fa;font-size:17px;font-weight:700}.detail{fill:#b8c7d6;font-size:14px}.num{fill:#75ded2;font-size:14px;font-weight:700}</style><text x="30" y="40" class="title">CLEAR RESPONSIBILITIES</text><rect x="30" y="75" width="240" height="105" rx="12" fill="#1b2a39" stroke="#365067"/><text x="46" y="103" class="label">Bootstrap</text><text x="46" y="130" class="detail">Loads assets and settings</text><text x="46" y="152" class="detail">Composes and starts the app</text><rect x="360" y="75" width="280" height="105" rx="12" fill="#1b2a39" stroke="#365067"/><text x="376" y="103" class="label">Game</text><text x="376" y="130" class="detail">Rules, AI, bombs, and session</text><text x="376" y="152" class="detail">Turns state into presentation</text><rect x="360" y="205" width="280" height="105" rx="12" fill="#1b2a39" stroke="#365067"/><text x="376" y="233" class="label">Engine</text><text x="376" y="260" class="detail">Rendering, audio, input, assets</text><text x="376" y="282" class="detail">Resources and backend execution</text><rect x="730" y="205" width="240" height="105" rx="12" fill="#1b2a39" stroke="#365067"/><text x="746" y="233" class="label">Libraries</text><text x="746" y="260" class="detail">SDL3 · OpenGL · stb</text><text x="746" y="282" class="detail">Platform and support</text><g fill="none" stroke="#75ded2" stroke-width="2"><path d="M280 125h68m-6-5 6 5-6 5"/><path d="M500 185v13m-5-5 5 5 5-5"/><path d="M650 255h68m-6-5 6 5-6 5"/></g><text x="30" y="333" class="detail">Game defines meaning. Engine provides the mechanisms.</text></svg>
