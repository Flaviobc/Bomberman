<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="Evolution: window, 2D, 3D, living scene, modularity, variety, AI, and optimization"><rect width="1000" height="390" rx="20" fill="#101923"/><style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f0f5fa;font-size:22px;font-weight:700}.label{fill:#f0f5fa;font-size:17px;font-weight:700}.detail{fill:#b8c7d6;font-size:14px}.num{fill:#75ded2;font-size:14px;font-weight:700}</style><text x="30" y="40" class="title">ONE LESSON AT A TIME</text><rect x="30" y="70" width="220" height="120" rx="12" fill="#1b2a39" stroke="#365067"/><text x="46" y="97" class="num">01</text><text x="46" y="127" class="label">Window</text><text x="46" y="156" class="detail">Setup, events, and loop</text><path d="M255 130h14m-5 -5 5 5-5 5" fill="none" stroke="#75ded2" stroke-width="2"/><rect x="275" y="70" width="220" height="120" rx="12" fill="#1b2a39" stroke="#365067"/><text x="291" y="97" class="num">02</text><text x="291" y="127" class="label">2D prototype</text><text x="291" y="156" class="detail">Movement, bombs, collisions</text><path d="M500 130h14m-5 -5 5 5-5 5" fill="none" stroke="#75ded2" stroke-width="2"/><rect x="520" y="70" width="220" height="120" rx="12" fill="#1b2a39" stroke="#365067"/><text x="536" y="97" class="num">03</text><text x="536" y="127" class="label">First 3D scene</text><text x="536" y="156" class="detail">Blender, GLB, and camera</text><path d="M745 130h14m-5 -5 5 5-5 5" fill="none" stroke="#75ded2" stroke-width="2"/><rect x="765" y="70" width="220" height="120" rx="12" fill="#1b2a39" stroke="#365067"/><text x="781" y="97" class="num">04</text><text x="781" y="127" class="label">Bringing it to life</text><text x="781" y="156" class="detail">Animation, light, and audio</text><rect x="30" y="220" width="220" height="120" rx="12" fill="#1b2a39" stroke="#365067"/><text x="46" y="247" class="num">05</text><text x="46" y="277" class="label">Modularity</text